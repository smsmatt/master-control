# Master Control on a1 (10.0.0.12). host networking to reach a1-local services:
#   Code:Talker bridge :7900, ntfy :8880 (loopback), MLX :8881 (on ai), ChromaDB :18000.
# Image built on ai.matthewstevens.org (never on a1), pushed to applepublicdotcom.
services:
  master-control:
    # Pinned by digest, not by the rolling :testing tag. An unpinned rolling tag
    # is how a stale image lingers unnoticed in a running service.
    # v20260728-692ac0f9, built on ai 2026-07-28: the inbound MCP listener.
    # Pinned from the buildx push output, and re-read from the Docker API on a1
    # after the deploy: an earlier pin here named the first build of the day and
    # was already a revision behind by the time it was committed, which is the
    # same staleness the pin exists to prevent.
    image: applepublicdotcom/master-control-agent:testing@sha256:4dc4a971dbeb5fece5a1e67bbbfb4d8d929968673780e28703dcdb4380b1ca05
    container_name: master-control
    restart: unless-stopped
    network_mode: host
    command: ["daemon"]
    # Secrets only, from `pass`: NTFY_TOKEN, GREYNOISE_API_KEY, MC_LLM_KEY.
    # See master-control.env.example. MC_LLM_KEY is not repeated under
    # `environment:` on purpose — a value there would be readable in the compose
    # file and in `docker inspect` output alike, and this one belongs in the
    # gitignored env file.
    env_file:
      - ./master-control.env
    environment:
      # MTPLX on ai (not Ollama; the vars were named OLLAMA_* historically).
      MC_LLM_URL: "http://10.0.0.96:8881"
      # The name ai:8881 actually serves (probed 2026-07-28). It previously read
      # mlx-community/Qwen3-14B-4bit-AWQ, which no longer exists there; mtplx
      # ignores the requested name and answers with whatever is loaded, so the
      # mismatch never surfaced as an error, only as a misleading config.
      MC_LLM_MODEL: "qwen3.5-9b-mtplx"
      CODETALKER_BRIDGE_URL: "http://10.0.0.12:7900"
      NTFY_URL: "http://127.0.0.1:8880"
      # universal-exports only. ghostmode-alerts is the Phenom CLIENT view of the
      # same conditions and the publishers mirror to both, so subscribing to both
      # made Master Control announce every condition twice. Over the 2026-07-28
      # 24h ntfy corpus (312 messages) every distinct ghostmode-alerts message
      # also appeared on universal-exports — 0 unique to it, 5 unique the other
      # way (a1-local Prometheus alerts) — so nothing observed is lost here.
      # That is an observation, not a guarantee: if a publisher is ever pointed
      # at ghostmode-alerts alone, add it back. contentKey no longer includes the
      # topic either, which collapses mirrors whatever they are published to;
      # this narrower subscription is the cheap belt to that braces.
      NTFY_TOPICS: "universal-exports"
      MC_CONTROL_TOPIC: "mc-control"
      # Inbound listener for the Code:Talker bridge. Bound to a1's LAN address,
      # not loopback: the bridge runs on the default docker bridge network, so
      # its 127.0.0.1 is its own, not a1's. Q confirmed this before it was built.
      # MC_LISTEN_TOKEN lives in master-control.env with the other secrets; with
      # it unset the listener refuses to open and ntfy mc-control stays the only
      # inbound channel.
      MC_LISTEN_HOST: "0.0.0.0"
      MC_LISTEN_PORT: "7910"
      MC_INTERVAL_MS: "120000"
      MC_SEEN_PATH: "/opt/data/mc-seen.json"
    volumes:
      # Named volume, NOT a host bind mount: Synology DSM squashes container
      # root on bind-mounted shares, so /opt/data writes (seen-set + narration
      # ledger) silently EACCES'd. A docker-managed named volume is writable by
      # the container and persists across restarts/recreates.
      - mc-data:/opt/data
    # Least privilege: this agent only polls, judges, and speaks.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          # NOTE: cpus limit omitted — Synology DSM (a1) kernel lacks the CPU
          # CFS scheduler, so `cpus:` makes `docker compose up` fail with
          # "NanoCPUs can not be set". Memory limit is honoured.
          memory: 256M

volumes:
  mc-data:
